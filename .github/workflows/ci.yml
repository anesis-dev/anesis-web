name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A new advisory lands against an unchanged lockfile all the time. Without
    # this, the audit below only ever runs on the next PR.
    - cron: "0 6 * * 1"

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        # `test:coverage` rather than `test`: the coverage thresholds in
        # vitest.config.ts are a ratchet, and they only fail a build when
        # something actually measures coverage.
        run: bun run test:coverage

      - name: Build
        run: bun run build

  security:
    # This repo has no `cargo audit` counterpart, so its dependency tree was the
    # only one in the project with nothing watching it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # Fails the job on a high or critical advisory. Lower severities are
        # reported but left to Dependabot, so CI does not turn red for a
        # transitive low that has no patch yet.
        run: bun audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        # playwright.config.ts's webServer builds + starts the app itself.
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
